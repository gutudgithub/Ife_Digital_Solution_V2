{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ heading }} · {% translate "Ife Digital Solution" %}{% endblock %}
{% block content %}
  <div class="page-heading"><div><h1>{{ heading }}</h1></div></div>
  <div class="card form-card">
    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" with form=form %}
      <div class="action-row">
        <button class="button" type="submit">{% translate "Return to draft" %}</button>
        <a class="button button--secondary" href="{% url 'documents:detail' transcription.document.id %}">{% translate "Cancel" %}</a>
      </div>
    </form>
  </div>
{% endblock %}
